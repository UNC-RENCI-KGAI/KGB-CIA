{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kgb-mcp.fullname" . }}-mcp
  labels:
    {{- include "kgb-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kgb-mcp.name" . }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kgb-mcp.name" . }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NEO4J_URI
              value: bolt://{{ include "kgb-mcp.neo4jService" . }}:7687
            {{- if .Values.neo4j.auth.enabled }}
            - name: NEO4J_USER
              value: {{ .Values.neo4j.user | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "secret.existingSecret is required when neo4j.auth.enabled" .Values.secret.existingSecret }}
                  key: {{ .Values.secret.userPasswordKey }}
            {{- end }}
            - name: NEO4J_DATABASE
              value: {{ .Values.neo4j.database | quote }}
            - name: KGB_MCP_ARTIFACTS
              value: {{ required "mcp.artifactsUrl is required when mcp.enabled" .Values.mcp.artifactsUrl | quote }}
            - name: KGB_MCP_ARTIFACTS_SHA256
              value: {{ required "mcp.artifactsSha256 is required when mcp.enabled" .Values.mcp.artifactsSha256 | quote }}
            - name: KGB_MCP_ENABLE_CYPHER
              value: {{ .Values.mcp.enableCypher | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kgb-mcp.fullname" . }}-mcp
  labels:
    {{- include "kgb-mcp.labels" . | nindent 4 }}
  {{- with .Values.mcp.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "kgb-mcp.name" . }}
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.mcp.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kgb-mcp.fullname" . }}-mcp
  labels:
    {{- include "kgb-mcp.labels" . | nindent 4 }}
  {{- with .Values.mcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mcp.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- range .Values.mcp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "kgb-mcp.fullname" $ }}-mcp
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
