{{- if .Values.neo4j.auth.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kgb-mcp.fullname" . }}-create-user
  labels:
    {{- include "kgb-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        {{- include "kgb-mcp.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-user
          image: {{ .Values.neo4j.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ required "secret.existingSecret is required" .Values.secret.existingSecret }}
                  key: {{ .Values.secret.adminAuthKey }}
            - name: NEO4J_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.userPasswordKey }}
            - name: NEO4J_APP_USER
              value: {{ .Values.neo4j.user | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "$NEO4J_APP_USER" in *[!A-Za-z0-9_-]*|'') exit 2;; esac
              admin_password="${NEO4J_AUTH#neo4j/}"
              # `RETURN` is a user-database query and is rejected by `system`.
              # Use the graph database only to wait for Bolt/authentication, then
              # switch to `system` for the administrative CREATE USER command.
              until cypher-shell -a bolt://{{ include "kgb-mcp.neo4jService" . }}:7687 \
                -u neo4j -p "$admin_password" -d {{ .Values.neo4j.database | quote }} 'RETURN 1' >/dev/null 2>&1; do sleep 5; done
              # cypher-shell parameters use `name => Cypher-literal` syntax. Escape
              # backslashes and quotes before embedding the Secret value as a literal.
              app_password_literal=$(printf '%s' "$NEO4J_APP_PASSWORD" | sed \
                -e 's/\\/\\\\/g' -e "s/'/\\\\'/g")
              cypher-shell -a bolt://{{ include "kgb-mcp.neo4jService" . }}:7687 \
                -u neo4j -p "$admin_password" -d system \
                --param "app_password => '$app_password_literal'" \
                "CREATE USER $NEO4J_APP_USER IF NOT EXISTS SET PASSWORD \$app_password CHANGE NOT REQUIRED"
              # Keep the database credential synchronized if the Secret is rotated
              # after an earlier successful install. Neo4j rejects an unchanged password;
              # that specific result is the successful, idempotent case after CREATE USER.
              if ! alter_output=$(cypher-shell -a bolt://{{ include "kgb-mcp.neo4jService" . }}:7687 \
                -u neo4j -p "$admin_password" -d system \
                --param "app_password => '$app_password_literal'" \
                "ALTER USER $NEO4J_APP_USER SET PASSWORD \$app_password CHANGE NOT REQUIRED" 2>&1); then
                case "$alter_output" in
                  *'Old password and new password cannot be the same.'*) ;;
                  *) printf '%s\\n' "$alter_output" >&2; exit 1 ;;
                esac
              fi
{{- end }}
