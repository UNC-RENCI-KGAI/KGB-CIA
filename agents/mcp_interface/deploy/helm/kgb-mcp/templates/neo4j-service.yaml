apiVersion: v1
kind: Service
metadata:
  name: {{ include "kgb-mcp.neo4jService" . }}
  labels:
    {{- include "kgb-mcp.labels" . | nindent 4 }}
  {{- with .Values.neo4j.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.neo4j.service.type }}
  {{- with .Values.neo4j.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "kgb-mcp.name" . }}
    app.kubernetes.io/component: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    {{- if .Values.neo4j.service.httpEnabled }}
    - name: http
      port: 7474
      targetPort: http
    {{- end }}
