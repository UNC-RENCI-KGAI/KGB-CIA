[project]
name = "kgbcia-mcp"
version = "0.1.0"
description = "Read-only MCP server for the KGB-CIA biomedical knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Released 2026-10-20; newest 3.x release at least two weeks old on selection.
    "fastmcp==3.4.11",
    "neo4j>=5,<6",
    "pydantic>=2,<3",
    # The graph was built with Biolink 4.4.6; used for nodes' most specific categories.
    "bmt>=1.5.0,<2",
    "biolink-model==4.4.6",
]

[project.urls]
Repository = "https://github.com/UNC-RENCI-KGAI/KGB-CIA"

[project.scripts]
kgbcia-mcp = "kgbcia_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgbcia_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/kgbcia_mcp", "README.md", "pyproject.toml", "LICENSE"]

