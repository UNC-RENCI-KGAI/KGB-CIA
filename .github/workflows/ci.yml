name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4   # for the helm chart test
      - run: uv sync --dev --all-extras
      - run: make test               # lint, every test (ORION and helm included), metadata skill's tests
      - run: make test-neo4j         # the MCP server against a toy graph in Neo4j (Docker)
      - run: uv run python -m shared.pipeline --dry-run
